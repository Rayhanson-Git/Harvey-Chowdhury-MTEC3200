<!doctype html><html lang="en"><meta charset="utf-8"><title>JimBro accessibility verification</title><style>body{background:#222;color:#eee;font:16px system-ui}button{padding:12px;margin:8px}iframe{width:100%;height:600px}pre{white-space:pre-wrap;max-height:150px;overflow:auto}</style><h1>Accessibility verification</h1><button onclick="frame.src='/today'">Today</button><button onclick="frame.src='/workout'">Workout</button><button onclick="frame.src='/history'">History</button><button onclick="frame.src='/progress'">Progress</button><button onclick="frame.src='/settings'">Settings</button><button onclick="scan()">Scan current screen</button><pre id="result">Ready.</pre><iframe id="frame" title="JimBro QA screen" src="/workout" onload="const script=this.contentDocument.createElement('script');script.src='/qa-axe.js';this.contentDocument.head.appendChild(script)"></iframe><script>async function scan(){try{const a=await frame.contentWindow.axe.run(frame.contentDocument,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa']}});result.textContent=JSON.stringify({url:frame.contentWindow.location.pathname,violations:a.violations.map(v=>({id:v.id,impact:v.impact,description:v.description,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),incomplete:a.incomplete.map(v=>v.id)},null,2);}catch(e){result.textContent=e.message;}}</script></html>
