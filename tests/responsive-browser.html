<!doctype html><html lang="en"><meta charset="utf-8"><title>JimBro responsive browser QA</title><style>body{background:#222;color:white;font:16px system-ui;margin:12px}iframe{display:block;border:1px solid #777;margin-bottom:20px;background:#111}button{padding:12px;margin:6px}</style><h1>Responsive viewport frames</h1><p>Isolated preview data only. Browser frames provide actual CSS viewports; no physical-device testing is implied.</p><button onclick="document.querySelector('iframe').src='/today'">Today</button><button onclick="document.querySelector('iframe').src='/workout'">Workout</button><button onclick="document.querySelector('iframe').src='/settings'">Settings</button><button onclick="document.querySelector('iframe').src='/progress'">Progress</button><button onclick="document.querySelector('iframe').src='/jim-gallery'">Jim gallery</button><button onclick="document.querySelector('iframe').style.width='320px'">320px</button><button onclick="document.querySelector('iframe').style.width='768px'">768px</button><button onclick="document.querySelector('iframe').style.width='1280px'">1280px</button><button onclick="inspect()">Inspect frame</button><pre id="qa-result"></pre><script>function inspect(){const f=document.querySelector('iframe'),d=f.contentDocument;document.querySelector('#qa-result').textContent=JSON.stringify({width:f.contentWindow.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>f.contentWindow.innerWidth,rigs:[...d.querySelectorAll('.jim-rig')].map(e=>({pose:e.dataset.pose,motion:e.dataset.motion,running:e.getAnimations({subtree:true}).filter(a=>a.playState==='running').map(a=>a.animationName)})),unlabeledInputs:[...d.querySelectorAll('input,select,textarea')].filter(e=>e.type!=='hidden'&&!e.labels?.length&&!e.getAttribute('aria-label')).length},null,2);}</script><iframe title="JimBro responsive viewport" src="/today" style="width:320px;height:740px"></iframe></html>
